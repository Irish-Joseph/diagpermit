name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.CLIVersion=${GITHUB_REF_NAME#v}" \
              -o "dist/diagpermit-${goos}-${goarch}${ext}" ./cmd/diagpermit
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum diagpermit-* > SHA256SUMS
      - name: SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -output dist/bom.json
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
